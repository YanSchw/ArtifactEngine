name: Build

on:
  push:
    branches: [ "main", "*dev*" ]
  pull_request:
    branches: [ "main", "*dev*" ]

jobs:
  Build:
    name: ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      # All nine jobs run independently, so one broken configuration does not
      # cancel the other eight.
      fail-fast: false
      matrix:
        platform: [Win64, MacOS, Linux]
        configuration: [Debug, Dev, Dist]
        include:
          - platform: Win64
            runner: windows-latest
          - platform: MacOS
            runner: macos-latest
          - platform: Linux
            runner: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv venv
          # Put the venv on PATH for every later step, so none of them has to
          # activate it — an activation would not survive the step boundary.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install SDK
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ./ArtifactSDK/.
          artifact version

      - name: Install development dependencies
        shell: bash
        run: artifact setup all

      - name: Expose the Vulkan SDK to the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The installer writes VULKAN_SDK to the user environment, which this
          # already-running job does not inherit, and CMake's FindVulkan has no
          # other way to locate the SDK on Windows.
          $sdk = Get-ChildItem "$env:SystemDrive\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: bash
        run: artifact build --target ${{ matrix.platform }} --configuration ${{ matrix.configuration }} --clean --skip-ide-project
